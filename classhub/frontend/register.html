<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register – ClassHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<button class="ch-theme-toggle position-fixed top-0 end-0 m-3" style="z-index:1050;"><i class="ch-theme-icon bi bi-moon-stars-fill"></i></button>

<div class="ch-auth-wrapper">
  <div class="ch-auth-card ch-fade-in" style="max-width:520px;">
    <div class="text-center mb-4">
      <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-2">
        <span class="ch-logo-badge"><i class="bi bi-mortarboard-fill"></i></span>
        <span class="fw-bold fs-4" style="color:var(--ch-text)">ClassHub</span>
      </a>
      <h4 class="fw-bold mb-1">Create Student Account</h4>
      <p class="small" style="color:var(--ch-text-muted)">Join ClassHub in under a minute</p>
    </div>

    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="nameInput" placeholder="Enter your full name" required minlength="2">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Roll Number</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-vcard"></i></span>
            <input type="text" class="form-control" id="rollNumberInput" placeholder="e.g. CSE21010" required>
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Phone Number</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
            <input type="tel" class="form-control" id="phoneInput" placeholder="10-digit number" pattern="[0-9]{10}" maxlength="10" required>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="emailInput" placeholder="you@classhub.edu" required>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="passwordInput" placeholder="Min. 6 characters" minlength="6" required>
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Re-enter password" minlength="6" required>
          </div>
        </div>
      </div>

      <div id="registerError" class="alert alert-danger small py-2 d-none"></div>
      <div id="registerSuccess" class="alert alert-success small py-2 d-none"></div>

      <button type="submit" class="btn btn-ch-primary w-100 py-2 mb-3" id="registerBtn">
        <i class="bi bi-person-plus me-2"></i>Create Account
      </button>

      <p class="text-center small mb-0" style="color:var(--ch-text-muted)">
        Already have an account? <a href="login.html" class="fw-bold" style="color:var(--ch-primary)">Login here</a>
      </p>
      <p class="text-center small mt-2">
        <a href="index.html" style="color:var(--ch-text-muted)"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
      </p>
    </form>
  </div>
</div>

<div id="chToastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/utils.js"></script>
<script>
  if (ChAuth.isLoggedIn()) {
    const user = ChAuth.getUser();
    window.location.href = `${user.role}/dashboard.html`;
  }

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('registerError');
    const successBox = document.getElementById('registerSuccess');
    errorBox.classList.add('d-none');
    successBox.classList.add('d-none');

    const name = document.getElementById('nameInput').value.trim();
    const roll_number = document.getElementById('rollNumberInput').value.trim();
    const phone = document.getElementById('phoneInput').value.trim();
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const confirm_password = document.getElementById('confirmPasswordInput').value;

    if (!/^[0-9]{10}$/.test(phone)) {
      errorBox.textContent = 'Phone number must be exactly 10 digits.';
      errorBox.classList.remove('d-none');
      return;
    }
    if (password !== confirm_password) {
      errorBox.textContent = 'Password and Confirm Password do not match.';
      errorBox.classList.remove('d-none');
      return;
    }

    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

    try {
      await ChAPI.post('/auth/student/register', { name, roll_number, email, phone, password, confirm_password });
      successBox.textContent = 'Registration successful! Redirecting to login...';
      successBox.classList.remove('d-none');
      ChUtils.toast('Account created successfully!', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove('d-none');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Create Account';
    }
  });
</script>
</body>
</html>
